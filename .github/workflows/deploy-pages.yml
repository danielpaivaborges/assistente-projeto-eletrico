name: Publicar aplicativo no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ativar GitHub Pages quando necessario
        uses: actions/github-script@v7
        with:
          script: |
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo
            };

            try {
              const page = await github.rest.repos.getPages(params);
              if (page.data.build_type !== 'workflow') {
                await github.rest.repos.updateInformationAboutPagesSite({
                  ...params,
                  build_type: 'workflow'
                });
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createPagesSite({
                ...params,
                build_type: 'workflow'
              });
            }

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Construir e verificar o aplicativo
        run: npm run check

      - name: Enviar site estatico
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
